[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arthur-runtime"
version = "0.3.4"
description = "Lightweight Headless Chromium Runtime for Gloria and AI Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "websockets>=12.0",
]

[project.scripts]
arthur = "arthur.cli:main"
arthur-runtime = "arthur.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arthur"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
